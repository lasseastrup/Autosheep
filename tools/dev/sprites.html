<!doctype html><html><head><style>body{background:#3e3546;margin:0}canvas{image-rendering:pixelated;width:1440px;height:810px}</style></head>
<body><canvas id=c width=480 height=270></canvas>
<script type="module">
import { drawSprite, SPRITE_NAMES } from '/src/engine/sprites.ts';
